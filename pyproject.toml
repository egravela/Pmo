[project]
name = "pmo"
version = "0.1.0"
description = "PMO La Traccia: tracciabilità delle pratiche (stima → offerta → ordine → specifiche → consegna → fattura) da Gmail e Google Drive, con solleciti automatici."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "jinja2>=3.1,<4",
    "python-multipart>=0.0.9",
    "itsdangerous>=2.2,<3",
    "sqlalchemy>=2.0,<3",
    "alembic>=1.13,<2",
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "google-api-python-client>=2.130,<3",
    "google-auth>=2.30,<3",
    "google-auth-oauthlib>=1.2,<2",
    "google-auth-httplib2>=0.2,<1",
    "anthropic>=2.0,<3",
    "cryptography>=42",
    "apscheduler>=3.10,<4",
    "typer>=0.12,<1",
    "python-dateutil>=2.9,<3",
    "beautifulsoup4>=4.12,<5",
    "pypdf>=4.2,<7",
    "python-docx>=1.1,<2",
    "pyyaml>=6,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27,<1",
    "ruff>=0.5",
]

[project.scripts]
pmo = "pmo.cli:app"

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pmo"]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["ignore::DeprecationWarning"]
